name: Multi-Stage Docker Deployment

on:
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DOCKERHUB: docker.io
  IMAGE_NAME: ${{ github.repository }}
  TAG: latest

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.image-tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: echo "image-tag=${{ env.TAG }}" >> $GITHUB_OUTPUT

      - name: Build and save Docker image
        run: |
          docker build -t my-image:${{ env.TAG }} .
          docker save my-image:${{ env.TAG }} -o image.tar

      - name: Upload Docker image tarball
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  deploy-ghcr:
    name: Push to GitHub Container Registry
    needs: build
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image tarball
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load and tag image for GHCR
        run: |
          docker load -i image.tar
          docker tag my-image:${{ env.TAG }} ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        run: docker push ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}

  deploy-dockerhub:
    name: Push to Docker Hub
    needs: build
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image tarball
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load and tag image for Docker Hub
        run: |
          docker load -i image.tar
          docker tag my-image:${{ env.TAG }} ${{ env.REGISTRY_DOCKERHUB }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push to Docker Hub
        run: docker push ${{ env.REGISTRY_DOCKERHUB }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
